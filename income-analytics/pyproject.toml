[build-system]
requires = ["setuptools>=84.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "income-analytics"
version = "0.1.0"
description = "Financial analytics platform for investment tracking."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0",
    "pydantic>=2.11",
    "firebase-admin>=7.7,<8",
    "alembic>=1.19,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "mypy>=1.17",
    "httpx>=0.28,<1",
    "requests>=2.32,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true

mypy_path = "src"

explicit_package_bases = true
