name: CI offline

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Reproduce repository blobs; do not rewrite frozen files to satisfy CERT_48.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: ci-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: CI / ${{ matrix.check }} (windows-py314)
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [runtime, ruff, mypy, python, cert48]
    defaults:
      run:
        shell: pwsh
        working-directory: income-analytics
    env:
      CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_LOCK: ${{ matrix.check == 'runtime' && 'ci/runtime-windows-py314.lock' || 'ci/requirements-windows-py314.lock' }}
    steps:
      - name: Checkout candidate without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: income-analytics/${{ env.CI_LOCK }}
      - name: Create isolated virtual environment
        run: python -m venv .venv
      - name: Install hash-checked wheels
        run: |
          ./.venv/Scripts/python.exe -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r $env:CI_LOCK
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip --isolated install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated check (failure is not waived)
        run: ./.venv/Scripts/python.exe ci/run.py ${{ matrix.check }}
      - name: Upload payload-free reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ matrix.check }}-${{ github.sha }}
          path: |
            income-analytics/ci-reports/${{ matrix.check }}/result.json
            income-analytics/ci-reports/${{ matrix.check }}/*-junit.xml
            income-analytics/ci-reports/${{ matrix.check }}/coverage.xml
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  node:
    name: CI / node (windows-node24)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: income-analytics
    env:
      CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Run all frontend suites offline, without npm dependencies
        run: python ci/run.py node
      - name: Upload suite status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-node-${{ github.sha }}
          path: income-analytics/ci-reports/node/result.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
