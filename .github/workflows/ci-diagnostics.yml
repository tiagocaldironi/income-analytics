name: CI historical diagnostics

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: ci-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full_python:
    name: CI / Full Python diagnostic
    if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-candidate')) }}
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: income-analytics
    env:
      CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_LOCK: ci/requirements-windows-py314.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: income-analytics/${{ env.CI_LOCK }}
      - name: Install hash-checked test dependencies
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r $env:CI_LOCK
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip --isolated install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete Python diagnostic once
        run: ./.venv/Scripts/python.exe ci/governance_controller.py python
      - name: Upload full and derived financial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-python-${{ github.sha }}
          path: |
            income-analytics/ci-reports/python/result.json
            income-analytics/ci-reports/financial/result.json
            income-analytics/ci-reports/python/python-junit.xml
            income-analytics/ci-reports/python/inventory.json
            income-analytics/ci-reports/python/coverage.xml
            income-analytics/ci-reports/python/financial/scoped-financial.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  financial:
    name: CI / Financial certification
    if: ${{ always() && !(github.event_name == 'pull_request' && (contains(fromJSON('[69,79,81]'), github.event.pull_request.number) || contains(github.event.pull_request.labels.*.name, 'release-candidate'))) }}
    needs: [full_python]
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
        working-directory: income-analytics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: diagnostics-python-${{ github.sha }}
          path: income-analytics/diagnostic-inputs
      - name: Evaluate financial report from the same full-suite execution
        run: |
          $report = Get-Content -Raw 'diagnostic-inputs/financial/result.json' | ConvertFrom-Json
          $report | Select-Object status,financial_state,blockers,totals | ConvertTo-Json -Depth 5
          if ($report.status -ne 'PASS' -or $report.financial_state -ne 'FINANCIAL_PASS') { exit 1 }
